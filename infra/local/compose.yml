# =============================================================================
# MoodleShield · LOCAL
#
# Topología:  CLOUDFLARE ──▶ tu equipo ──▶ contenedores
#
# Stack completo construido DESDE EL CÓDIGO FUENTE (no tira de ghcr.io), para
# probar y depurar en tu máquina con la misma forma que producción: nginx con
# secure_link delante, worker con ffmpeg, Postgres.
#
#   cd infra/local
#   docker compose up -d --build                 # sin túnel → http://localhost:8088
#   docker compose --profile quick up -d         # + URL https efímera (trycloudflare)
#   docker compose --profile cloudflare up -d    # + túnel con nombre (URL estable)
#
# Secretos: aquí son valores de desarrollo incrustados con `:-` (inseguros a
# propósito y sobreescribibles por entorno). Ningún secreto real vive en este
# fichero ni en el .env de esta carpeta.
# =============================================================================

name: moodleshield-local

x-app-env: &app-env
  # development: permite PUBLIC_URL http y secretos por defecto. La mecánica
  # (firma de segmentos, cifrado, LTI) es idéntica a producción.
  NODE_ENV: development
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8088}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: moodleshield
  DB_USER: moodleshield
  DB_PASSWORD: ${DB_PASSWORD:-moodleshield-local}
  SESSION_SECRET: ${SESSION_SECRET:-local-inseguro-session-00000000000000000000}
  WATERMARK_SECRET: ${WATERMARK_SECRET:-local-inseguro-watermark-00000000000000000000}
  MEDIA_KEY_SECRET: ${MEDIA_KEY_SECRET:-local-inseguro-mediakey-00000000000000000000}
  # ⚠️ Debe coincidir con el MEDIA_LINK_SECRET del servicio proxy (abajo).
  MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET:-local-inseguro-medialink-00000000000000000000}
  LTI_ADMIN_TOKEN: ${LTI_ADMIN_TOKEN:-local-admin}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
  ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
  ADMIN_ALLOW_PRIVATE_LTI_HOSTS: ${ADMIN_ALLOW_PRIVATE_LTI_HOSTS:-false}
  LTI_IDENTITY_CUSTOM_PARAM: ${LTI_IDENTITY_CUSTOM_PARAM:-username}
  MEDIA_ROOT: /data/media
  UPLOAD_ROOT: /data/uploads
  MEDIA_DELIVERY: signed
  MEDIA_PUBLIC_PREFIX: /media
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
  UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-16777216}
  UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-86400}
  SEGMENT_SECONDS: ${SEGMENT_SECONDS:-4}
  OUTPUT_FPS: ${OUTPUT_FPS:-24}
  OUTPUT_CRF: ${OUTPUT_CRF:-23}
  OUTPUT_PRESET: ${OUTPUT_PRESET:-veryfast}
  # Marca A/B visible a simple vista: en local se quiere VER el patrón.
  MARK_ALPHA: ${MARK_ALPHA:-0.5}
  TRANSCODE_CONCURRENCY: "1"
  TRANSCODE_LEASE_SECONDS: ${TRANSCODE_LEASE_SECONDS:-90}
  TRANSCODE_HEARTBEAT_MS: ${TRANSCODE_HEARTBEAT_MS:-20000}
  FFMPEG_NICE: "10"
  MAX_PDF_BYTES: ${MAX_PDF_BYTES:-104857600}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
  PDF_PROCESS_TIMEOUT_SECONDS: ${PDF_PROCESS_TIMEOUT_SECONDS:-180}
  MAX_FOLDERS_PER_OWNER: ${MAX_FOLDERS_PER_OWNER:-100}
  MAX_COLLECTION_ITEMS: ${MAX_COLLECTION_ITEMS:-50}
  MATERIAL_REVISION_ACTIVATION: ${MATERIAL_REVISION_ACTIVATION:-auto}
  MATERIAL_REVISION_RETENTION_DAYS: ${MATERIAL_REVISION_RETENTION_DAYS:-30}
  MATERIAL_REVISION_KEEP_MIN: ${MATERIAL_REVISION_KEEP_MIN:-2}
  MATERIAL_ARCHIVE_RETENTION_DAYS: ${MATERIAL_ARCHIVE_RETENTION_DAYS:-90}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: moodleshield
      POSTGRES_USER: moodleshield
      POSTGRES_PASSWORD: ${DB_PASSWORD:-moodleshield-local}
    volumes:
      - "${DATA_ROOT:-./data}/pgdata:/var/lib/postgresql/data:Z"
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h db -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: app
    image: moodleshield/app:local
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - "${DATA_ROOT:-./data}/media:/data/media:z"
      - "${DATA_ROOT:-./data}/uploads:/data/uploads:z"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: ../..
      dockerfile: docker/Dockerfile
      target: worker
    image: moodleshield/worker:local
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    environment: *app-env
    volumes:
      - "${DATA_ROOT:-./data}/media:/data/media:z"
      - "${DATA_ROOT:-./data}/uploads:/data/uploads:z"

  # Igual que en test y prod, la configuración de nginx va DENTRO de la imagen.
  # Se construye aquí en vez de montarla para que lo que se prueba en local sea
  # exactamente el artefacto que se despliega: si tocas infra/nginx/, reconstruye
  # con `docker compose up -d --build proxy`.
  proxy:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.proxy
    image: moodleshield/proxy:local
    restart: unless-stopped
    depends_on:
      app:
        condition: service_started
    environment:
      # ⚠️ Mismo valor que MEDIA_LINK_SECRET del app-env. Si difieren, todos
      # los segmentos devuelven 403.
      MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET:-local-inseguro-medialink-00000000000000000000}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2g}
    volumes:
      - "${DATA_ROOT:-./data}/media:/srv/media:ro,z"
    ports:
      - "127.0.0.1:${HTTP_PORT:-8088}:8080"
    # Healthcheck definido en docker/Dockerfile.proxy.

  # --- Túnel efímero: URL https aleatoria de trycloudflare.com, sin cuenta ---
  # La URL cambia en cada arranque → hay que actualizar PUBLIC_URL (ver README).
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: [quick]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://proxy:8080
    depends_on:
      proxy:
        condition: service_started

  # --- Túnel con nombre: URL estable, la buena para registrar en Moodle -------
  # Requiere CLOUDFLARE_TUNNEL_TOKEN (ver .env.example → .env.local).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: [cloudflare]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Si arrancas este perfil sin token, cloudflared falla y sus logs lo
      # dicen. El token va en .env.local (gitignorado):
      #   docker compose --env-file .env --env-file .env.local --profile cloudflare up -d
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      proxy:
        condition: service_started
