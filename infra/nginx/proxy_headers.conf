# V-13/T29: se REEMPLAZA la cadena recibida. Añadirla con
# `$proxy_add_x_forwarded_for` permitía que un cliente con IP privada colocase
# otro valor a su izquierda y Express lo aceptase como evidencia. La app confía
# exactamente en este salto nginx (`TRUST_PROXY=1`).
#
# Si delante hay cloudflared y `$remote_addr` es la IP privada del túnel,
# configura TRUST_CLOUDFLARE_CLIENT_IP=always: client-ip.js tomará entonces la
# cabecera que escribió el túnel. Con Cloudflare directo, `auto` comprueba que
# `$remote_addr` pertenece a sus rangos antes de creer CF-Connecting-IP.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
# El túnel externo ya hizo TLS; la app necesita saberlo para generar URLs https.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
# `$http_host` y no `$host`: `$host` descarta el puerto, y sin él la aplicación
# no puede distinguir `http://localhost:8088` de `http://localhost` al decidir
# con qué origen construye el redirect_uri de LTI y las URLs del visor.
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header Connection        "";
proxy_buffering on;
