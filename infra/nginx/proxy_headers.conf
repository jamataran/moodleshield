proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# El túnel externo ya hizo TLS; la app necesita saberlo para generar URLs https.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
# `$http_host` y no `$host`: `$host` descarta el puerto, y sin él la aplicación
# no puede distinguir `http://localhost:8088` de `http://localhost` al decidir
# con qué origen construye el redirect_uri de LTI y las URLs del visor.
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header Connection        "";
proxy_buffering on;
