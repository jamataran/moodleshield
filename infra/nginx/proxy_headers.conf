# ⚠️ V-13 · La dirección que se registra como evidencia forense es FALSIFICABLE
# con la configuración actual. `$proxy_add_x_forwarded_for` AÑADE el valor que
# mandó el cliente en vez de reemplazarlo, y `config.js` confía en rangos
# privados (`uniquelocal`): cuando el cliente real llega desde una IP privada
# (VPN institucional, red 10.x del campus, el propio Moodle), Express sigue
# saltando hasta el valor inyectado por el cliente y `req.ip` queda bajo su
# control. La corrección NO es una línea porque depende de la topología (túnel
# Cloudflare, Tailscale Funnel, proxy directo):
#
#   - Si delante hay un edge de confianza (p.ej. Cloudflare), pon TRUST_PROXY al
#     NÚMERO EXACTO de saltos de confianza y usa aquí el valor que ese edge
#     escribe, no el que añade el cliente.
#   - Si nginx es el primer y único proxy, usa `X-Forwarded-For $remote_addr`
#     (reemplaza, no añade) y TRUST_PROXY=1.
#
# Mientras esto no se resuelva para la topología real, `view_event.ip` no es
# prueba concluyente. Ver T29 en docs/auditoria-seguridad.md. Ligar la firma de
# segmentos a la IP (T26/V-12) EXIGE arreglar esto antes: firmar con una
# dirección que el cliente elige no protege de nada.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# El túnel externo ya hizo TLS; la app necesita saberlo para generar URLs https.
proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
# `$http_host` y no `$host`: `$host` descarta el puerto, y sin él la aplicación
# no puede distinguir `http://localhost:8088` de `http://localhost` al decidir
# con qué origen construye el redirect_uri de LTI y las URLs del visor.
proxy_set_header X-Forwarded-Host  $http_host;
proxy_set_header Connection        "";
proxy_buffering on;
