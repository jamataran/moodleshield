# =============================================================================
# MoodleShield · ENTORNO DE PRUEBAS
#
# Mismo diseño que producción, con tres diferencias deliberadas:
#   - MARK_ALPHA por defecto a 0.5: la marca A/B se ve a simple vista, que es
#     lo que hace demostrable el sistema sin tener que fiarse del script.
#   - Postgres publicado en localhost para poder inspeccionar la base de datos.
#   - Menos memoria y CPU reservadas: aquí no hay carga real.
#
# Se despliega igual que producción (Portainer + GitOps) o en local con un
# bloque real generado por scripts/generate-env.sh.
#
# Para generar el bloque de variables que hay que pegar en Portainer:
#   ./scripts/generate-env.sh test
# =============================================================================

name: moodleshield-test

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "2"

x-runtime-hardening: &runtime-hardening
  read_only: true
  cap_drop: [ "ALL" ]
  cap_add: [ "CHOWN", "DAC_OVERRIDE", "FOWNER", "SETGID", "SETUID" ]
  security_opt: [ "no-new-privileges:true" ]

x-app-env: &app-env
  NODE_ENV: production
  SERVICE_ROLE: app
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  PUBLIC_URL: ${PUBLIC_URL:?falta PUBLIC_URL}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-moodleshield}
  DB_USER: ${DB_USER:-moodleshield}
  DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
  DB_APP_USER: ${DB_APP_USER:-moodleshield_app}
  DB_APP_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD}
  DB_WORKER_USER: ${DB_WORKER_USER:-moodleshield_worker}
  DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?falta DB_WORKER_PASSWORD}
  DB_PROVISION_SERVICE_ROLES: "true"
  SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET}
  WATERMARK_SECRET: ${WATERMARK_SECRET:?falta WATERMARK_SECRET}
  MEDIA_KEY_SECRET: ${MEDIA_KEY_SECRET:?falta MEDIA_KEY_SECRET}
  MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET:?falta MEDIA_LINK_SECRET}
  LTI_ADMIN_TOKEN: ${LTI_ADMIN_TOKEN:-}
  CONTENT_API_TOKEN: ${CONTENT_API_TOKEN:-}
  CONTENT_API_ALLOWED_PLATFORM_IDS: ${CONTENT_API_ALLOWED_PLATFORM_IDS:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:?falta ADMIN_USERNAME}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?falta ADMIN_PASSWORD_HASH}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?falta ADMIN_SESSION_SECRET}
  ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
  ADMIN_ALLOW_PRIVATE_LTI_HOSTS: ${ADMIN_ALLOW_PRIVATE_LTI_HOSTS:-false}
  LTI_IDENTITY_CUSTOM_PARAM: ${LTI_IDENTITY_CUSTOM_PARAM:-username}
  LTI_IDENTITY_MOODLE_SOURCE: ${LTI_IDENTITY_MOODLE_SOURCE:-$$User.username}
  # T24: verificación de la referencia firmada del material en el launch.
  LAUNCH_RESOURCE_SIGNATURE: ${LAUNCH_RESOURCE_SIGNATURE:-enforce}
  # IP real del alumno tras un CDN (ADR-019): auto | always | never.
  # Otros nombres por los que se alcanza la MISMA instancia. Vacío = sólo
  # PUBLIC_URL, que es el comportamiento de siempre.
  PUBLIC_URL_ALIASES: ${PUBLIC_URL_ALIASES:-}
  TRUST_PROXY: ${TRUST_PROXY:-1}
  TRUST_CLOUDFLARE_CLIENT_IP: ${TRUST_CLOUDFLARE_CLIENT_IP:-auto}
  CDN_TRUSTED_RANGES: ${CDN_TRUSTED_RANGES:-}
  MEDIA_ROOT: /data/media
  UPLOAD_ROOT: /data/uploads
  MEDIA_DELIVERY: signed
  MEDIA_PUBLIC_PREFIX: /media
  MEDIA_LINK_TTL_SECONDS: ${MEDIA_LINK_TTL_SECONDS:-14400}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
  UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-16777216}
  UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-86400}
  STORAGE_MIN_FREE_BYTES: ${STORAGE_MIN_FREE_BYTES:-1073741824}
  MAX_ACTIVE_UPLOADS_PER_OWNER: ${MAX_ACTIVE_UPLOADS_PER_OWNER:-5}
  # -1 = cola sin tope. El disco lo siguen guardando STORAGE_MIN_FREE_BYTES
  # y MAX_STORED_BYTES_PER_OWNER.
  MAX_PENDING_JOBS_PER_OWNER: ${MAX_PENDING_JOBS_PER_OWNER:--1}
  MAX_RESERVED_UPLOAD_BYTES_PER_OWNER: ${MAX_RESERVED_UPLOAD_BYTES_PER_OWNER:-4294967296}
  MAX_STORED_BYTES_PER_OWNER: ${MAX_STORED_BYTES_PER_OWNER:-53687091200}
  PLAYBACK_MAX_DISTINCT_IPS: ${PLAYBACK_MAX_DISTINCT_IPS:-3}
  PLAYBACK_REVOKE_ON_SUSPICION: ${PLAYBACK_REVOKE_ON_SUSPICION:-true}
  SEGMENT_SECONDS: ${SEGMENT_SECONDS:-4}
  OUTPUT_FPS: ${OUTPUT_FPS:-24}
  OUTPUT_CRF: ${OUTPUT_CRF:-23}
  OUTPUT_PRESET: ${OUTPUT_PRESET:-veryfast}
  # Marca visible: en pruebas interesa verla.
  MARK_ALPHA: ${MARK_ALPHA:-0.5}
  TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
  TRANSCODE_LEASE_SECONDS: ${TRANSCODE_LEASE_SECONDS:-90}
  TRANSCODE_HEARTBEAT_MS: ${TRANSCODE_HEARTBEAT_MS:-20000}
  FFMPEG_NICE: ${FFMPEG_NICE:-10}
  MAX_PDF_BYTES: ${MAX_PDF_BYTES:-104857600}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
  PDF_PROCESS_TIMEOUT_SECONDS: ${PDF_PROCESS_TIMEOUT_SECONDS:-180}
  TRANSCODE_PROBE_TIMEOUT_SECONDS: ${TRANSCODE_PROBE_TIMEOUT_SECONDS:-30}
  TRANSCODE_PROCESS_TIMEOUT_SECONDS: ${TRANSCODE_PROCESS_TIMEOUT_SECONDS:-21600}
  VIDEO_MAX_OUTPUT_BITRATE_KBPS: ${VIDEO_MAX_OUTPUT_BITRATE_KBPS:-8000}
  VIDEO_MAX_DURATION_SECONDS: ${VIDEO_MAX_DURATION_SECONDS:-14400}
  VIDEO_MAX_PIXELS: ${VIDEO_MAX_PIXELS:-8294400}
  VIDEO_MAX_DIMENSION: ${VIDEO_MAX_DIMENSION:-4096}
  VIDEO_MAX_STREAMS: ${VIDEO_MAX_STREAMS:-16}
  VIDEO_MAX_SOURCE_FPS: ${VIDEO_MAX_SOURCE_FPS:-120}
  VIDEO_MAX_AUDIO_CHANNELS: ${VIDEO_MAX_AUDIO_CHANNELS:-8}
  MAX_FOLDERS_PER_OWNER: ${MAX_FOLDERS_PER_OWNER:-100}
  MAX_COLLECTION_ITEMS: ${MAX_COLLECTION_ITEMS:-50}
  MATERIAL_REVISION_ACTIVATION: ${MATERIAL_REVISION_ACTIVATION:-auto}
  MATERIAL_REVISION_RETENTION_DAYS: ${MATERIAL_REVISION_RETENTION_DAYS:-30}
  MATERIAL_REVISION_KEEP_MIN: ${MATERIAL_REVISION_KEEP_MIN:-2}
  MATERIAL_ARCHIVE_RETENTION_DAYS: ${MATERIAL_ARCHIVE_RETENTION_DAYS:-90}
  RATE_LIMIT_PUBLIC_AUTH_15M: ${RATE_LIMIT_PUBLIC_AUTH_15M:-120}
  RATE_LIMIT_MIGRATION_PER_MINUTE: ${RATE_LIMIT_MIGRATION_PER_MINUTE:-300}
  RATE_LIMIT_CATALOG_PER_MINUTE: ${RATE_LIMIT_CATALOG_PER_MINUTE:-600}
  RATE_LIMIT_PLAYBACK_PER_MINUTE: ${RATE_LIMIT_PLAYBACK_PER_MINUTE:-1200}

x-worker-env: &worker-env
  NODE_ENV: production
  SERVICE_ROLE: worker
  LOG_LEVEL: ${LOG_LEVEL:-debug}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-moodleshield}
  DB_WORKER_USER: ${DB_WORKER_USER:-moodleshield_worker}
  DB_WORKER_PASSWORD: ${DB_WORKER_PASSWORD:?falta DB_WORKER_PASSWORD}
  WATERMARK_SECRET: ${WATERMARK_SECRET:?falta WATERMARK_SECRET}
  MEDIA_ROOT: /data/media
  UPLOAD_ROOT: /data/uploads
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-14400}
  MEDIA_LINK_TTL_SECONDS: ${MEDIA_LINK_TTL_SECONDS:-14400}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-2147483648}
  UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-16777216}
  UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-86400}
  SEGMENT_SECONDS: ${SEGMENT_SECONDS:-4}
  OUTPUT_FPS: ${OUTPUT_FPS:-24}
  OUTPUT_CRF: ${OUTPUT_CRF:-23}
  OUTPUT_PRESET: ${OUTPUT_PRESET:-veryfast}
  MARK_ALPHA: ${MARK_ALPHA:-0.5}
  TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
  TRANSCODE_LEASE_SECONDS: ${TRANSCODE_LEASE_SECONDS:-90}
  TRANSCODE_HEARTBEAT_MS: ${TRANSCODE_HEARTBEAT_MS:-20000}
  FFMPEG_NICE: ${FFMPEG_NICE:-10}
  MAX_PDF_BYTES: ${MAX_PDF_BYTES:-104857600}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
  PDF_PROCESS_TIMEOUT_SECONDS: ${PDF_PROCESS_TIMEOUT_SECONDS:-180}
  TRANSCODE_PROBE_TIMEOUT_SECONDS: ${TRANSCODE_PROBE_TIMEOUT_SECONDS:-30}
  TRANSCODE_PROCESS_TIMEOUT_SECONDS: ${TRANSCODE_PROCESS_TIMEOUT_SECONDS:-21600}
  VIDEO_MAX_OUTPUT_BITRATE_KBPS: ${VIDEO_MAX_OUTPUT_BITRATE_KBPS:-8000}
  VIDEO_MAX_DURATION_SECONDS: ${VIDEO_MAX_DURATION_SECONDS:-14400}
  VIDEO_MAX_PIXELS: ${VIDEO_MAX_PIXELS:-8294400}
  VIDEO_MAX_DIMENSION: ${VIDEO_MAX_DIMENSION:-4096}
  VIDEO_MAX_STREAMS: ${VIDEO_MAX_STREAMS:-16}
  VIDEO_MAX_SOURCE_FPS: ${VIDEO_MAX_SOURCE_FPS:-120}
  VIDEO_MAX_AUDIO_CHANNELS: ${VIDEO_MAX_AUDIO_CHANNELS:-8}
  MATERIAL_REVISION_RETENTION_DAYS: ${MATERIAL_REVISION_RETENTION_DAYS:-30}
  MATERIAL_REVISION_KEEP_MIN: ${MATERIAL_REVISION_KEEP_MIN:-2}
  MATERIAL_ARCHIVE_RETENTION_DAYS: ${MATERIAL_ARCHIVE_RETENTION_DAYS:-90}

services:
  db:
    <<: *runtime-hardening
    image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moodleshield}
      POSTGRES_USER: ${DB_USER:-moodleshield}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/pgdata:/var/lib/postgresql/data:Z"
    ports:
      # Nunca reutilizar el bind HTTP: poner el gateway en 0.0.0.0 no debe
      # publicar PostgreSQL por accidente.
      - "${DB_BIND_ADDRESS:-127.0.0.1}:${DB_PORT_HOST:-55432}:5432"
    healthcheck:
      # Valida usuario/contraseña además de disponibilidad. pg_isready solo no
      # detecta un DB_PASSWORD distinto del que quedó guardado en pgdata.
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h db -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 256m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
      - /var/run/postgresql:rw,noexec,nosuid,nodev,size=16m
    logging: *logging
    networks: [backend]

  app:
    <<: *runtime-hardening
    image: ghcr.io/jamataran/moodleshield/app:sha-577bf4b
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/media:/data/media:z"
      - "${DATA_ROOT:?falta DATA_ROOT}/uploads:/data/uploads:z"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 384m
    pids_limit: 256
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m
    logging: *logging
    networks: [backend, edge]

  worker:
    <<: *runtime-hardening
    image: ghcr.io/jamataran/moodleshield/worker:sha-577bf4b
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy
    # cd-test.yml activa el entorno mínimo a la vez que publica la imagen nueva.
    environment: *worker-env # WORKER_ENV_ACTIVATION
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/media:/data/media:z"
      - "${DATA_ROOT:?falta DATA_ROOT}/uploads:/data/uploads:z"
    cpus: ${WORKER_CPUS:-1}
    mem_limit: ${WORKER_MEMORY:-1024m}
    pids_limit: 1024
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    logging: *logging
    networks: [backend]

  # La configuración de nginx viaja dentro de la imagen (docker/Dockerfile.proxy)
  # y se etiqueta a la vez que app y worker.
  proxy:
    <<: *runtime-hardening
    image: ghcr.io/jamataran/moodleshield/proxy:sha-577bf4b
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET:?falta MEDIA_LINK_SECRET}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-2g}
      MAX_CHUNK_SIZE: ${MAX_CHUNK_SIZE:-32m}
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/media:/srv/media:ro,z"
    ports:
      - "${HTTP_BIND_ADDRESS:-${BIND_ADDRESS:-127.0.0.1}}:${HTTP_PORT:-43128}:8080"
    # Healthcheck definido en la propia imagen `proxy`.
    mem_limit: 128m
    pids_limit: 128
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
      - /var/cache/nginx:rw,noexec,nosuid,nodev,size=32m
      - /var/run:rw,noexec,nosuid,nodev,size=4m
      - /etc/nginx/conf.d:rw,noexec,nosuid,nodev,size=4m
    logging: *logging
    networks: [edge]

networks:
  # Red interna sin salida a Internet: db y worker viven sólo aquí (V-33/F-10).
  backend:
    driver: bridge
    internal: true
  # Con salida: sólo app (JWKS de Moodle) y proxy (publica el puerto).
  edge:
    driver: bridge
