# =============================================================================
# MoodleShield · PRODUCCIÓN
#
# Pensado para desplegarse como stack de Portainer desde este repositorio
# (GitOps). Ver infra/README.md para el alta paso a paso.
#
# Reglas de la casa:
#   - Autocontenido: NADA se monta desde el repositorio. Portainer clona el
#     stack en su propio volumen, no en una ruta estable del host, así que un
#     bind a ficheros del repo apunta a un directorio que no existe y Docker lo
#     crea vacío. La configuración de nginx viaja dentro de la imagen `proxy`.
#   - Rutas de volumen absolutas: Portainer no ejecuta el compose desde una
#     carpeta estable, así que las rutas relativas apuntan a cualquier sitio.
#   - Los secretos se definen en las variables de entorno del stack en
#     Portainer, NUNCA en este repositorio. Las referencias de imagen de abajo
#     son el estado desplegado; el CI actualiza sus tags directamente aquí.
#   - Todo el estado persistente vive bajo ${DATA_ROOT}: pgdata, media y
#     uploads. Cambiar de host sólo exige copiar esa raíz y conservar el .env.
#
# Para generar el bloque de variables que hay que pegar en Portainer:
#   ./scripts/generate-env.sh prod
# =============================================================================

name: moodleshield

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  PUBLIC_URL: ${PUBLIC_URL:?falta PUBLIC_URL}
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: ${DB_NAME:-moodleshield}
  DB_USER: ${DB_USER:-moodleshield}
  DB_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
  SESSION_SECRET: ${SESSION_SECRET:?falta SESSION_SECRET}
  WATERMARK_SECRET: ${WATERMARK_SECRET:?falta WATERMARK_SECRET}
  MEDIA_KEY_SECRET: ${MEDIA_KEY_SECRET:?falta MEDIA_KEY_SECRET}
  MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET:?falta MEDIA_LINK_SECRET}
  LTI_ADMIN_TOKEN: ${LTI_ADMIN_TOKEN:-}
  CONTENT_API_TOKEN: ${CONTENT_API_TOKEN:-}
  ADMIN_USERNAME: ${ADMIN_USERNAME:?falta ADMIN_USERNAME}
  ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?falta ADMIN_PASSWORD_HASH}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:?falta ADMIN_SESSION_SECRET}
  ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
  ADMIN_ALLOW_PRIVATE_LTI_HOSTS: ${ADMIN_ALLOW_PRIVATE_LTI_HOSTS:-false}
  LTI_IDENTITY_CUSTOM_PARAM: ${LTI_IDENTITY_CUSTOM_PARAM:-username}
  # T24: verificación de la referencia firmada del material en el launch.
  # `warn` (por defecto) sirve el launch sin firma y deja aviso en el log;
  # pásalo a `enforce` cuando el aviso deje de aparecer.
  LAUNCH_RESOURCE_SIGNATURE: ${LAUNCH_RESOURCE_SIGNATURE:-warn}
  # IP real del alumno tras un CDN (ADR-019): auto | always | never.
  # Otros nombres por los que se alcanza la MISMA instancia. Vacío = sólo
  # PUBLIC_URL, que es el comportamiento de siempre.
  PUBLIC_URL_ALIASES: ${PUBLIC_URL_ALIASES:-}
  TRUST_CLOUDFLARE_CLIENT_IP: ${TRUST_CLOUDFLARE_CLIENT_IP:-auto}
  CDN_TRUSTED_RANGES: ${CDN_TRUSTED_RANGES:-}
  MEDIA_ROOT: /data/media
  UPLOAD_ROOT: /data/uploads
  MEDIA_DELIVERY: signed
  MEDIA_PUBLIC_PREFIX: /media
  MEDIA_LINK_TTL_SECONDS: ${MEDIA_LINK_TTL_SECONDS:-14400}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-4294967296}
  UPLOAD_CHUNK_BYTES: ${UPLOAD_CHUNK_BYTES:-16777216}
  UPLOAD_SESSION_TTL_SECONDS: ${UPLOAD_SESSION_TTL_SECONDS:-86400}
  SEGMENT_SECONDS: ${SEGMENT_SECONDS:-4}
  OUTPUT_FPS: ${OUTPUT_FPS:-24}
  OUTPUT_CRF: ${OUTPUT_CRF:-21}
  OUTPUT_PRESET: ${OUTPUT_PRESET:-veryfast}
  MARK_ALPHA: ${MARK_ALPHA:-0.06}
  TRANSCODE_CONCURRENCY: ${TRANSCODE_CONCURRENCY:-1}
  TRANSCODE_LEASE_SECONDS: ${TRANSCODE_LEASE_SECONDS:-90}
  TRANSCODE_HEARTBEAT_MS: ${TRANSCODE_HEARTBEAT_MS:-20000}
  FFMPEG_NICE: ${FFMPEG_NICE:-10}
  MAX_PDF_BYTES: ${MAX_PDF_BYTES:-104857600}
  MAX_PDF_PAGES: ${MAX_PDF_PAGES:-500}
  PDF_PROCESS_TIMEOUT_SECONDS: ${PDF_PROCESS_TIMEOUT_SECONDS:-180}
  MAX_FOLDERS_PER_OWNER: ${MAX_FOLDERS_PER_OWNER:-100}
  MAX_COLLECTION_ITEMS: ${MAX_COLLECTION_ITEMS:-50}
  MATERIAL_REVISION_ACTIVATION: ${MATERIAL_REVISION_ACTIVATION:-auto}
  MATERIAL_REVISION_RETENTION_DAYS: ${MATERIAL_REVISION_RETENTION_DAYS:-30}
  MATERIAL_REVISION_KEEP_MIN: ${MATERIAL_REVISION_KEEP_MIN:-2}
  MATERIAL_ARCHIVE_RETENTION_DAYS: ${MATERIAL_ARCHIVE_RETENTION_DAYS:-90}

services:
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-moodleshield}
      POSTGRES_USER: ${DB_USER:-moodleshield}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?falta DB_PASSWORD}
      # Acelera la escritura de segmentos sin afectar a la durabilidad del WAL.
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/pgdata:/var/lib/postgresql/data:Z"
    healthcheck:
      # pg_isready no autentica: con un pgdata antiguo y DB_PASSWORD nuevo
      # devolvía healthy mientras app/worker fallaban con 28P01. Esta consulta
      # prueba exactamente las credenciales que usan los demás servicios.
      # `-h db` fuerza TCP por la red Docker y, por tanto, SCRAM. El socket
      # local de la imagen usa trust y no serviría para validar la contraseña.
      test: ["CMD-SHELL", "PGPASSWORD=\"$${POSTGRES_PASSWORD}\" psql -h db -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\" -Atqc 'SELECT 1' | grep -qx 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    mem_limit: 512m
    pids_limit: 256
    security_opt: [ "no-new-privileges:true" ]
    logging: *logging
    # Sólo `backend`: la base de datos no tiene ninguna razón para alcanzar
    # Internet, y `backend` es una red interna (V-33/F-10).
    networks: [backend]

  # ---------------------------------------------------------------------------
  app:
    image: ghcr.io/jamataran/moodleshield/app:v1.0.5
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment: *app-env
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/media:/data/media:z"
      - "${DATA_ROOT:?falta DATA_ROOT}/uploads:/data/uploads:z"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    mem_limit: 512m
    pids_limit: 256
    security_opt: [ "no-new-privileges:true" ]
    logging: *logging
    # En las dos: `backend` para hablar con la base de datos y `edge` porque es
    # el ÚNICO servicio que necesita salida a Internet — descarga el JWKS de
    # cada Moodle registrado para validar los launches.
    networks: [backend, edge]

  # ---------------------------------------------------------------------------
  # El transcodificador. Va aparte del `app` para que un pico de ffmpeg no
  # tumbe el servicio web y para poder limitarle CPU de forma independiente.
  worker:
    image: ghcr.io/jamataran/moodleshield/worker:v1.0.5
    restart: unless-stopped
    init: true
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
      # app prepara los mounts, aplica migraciones y confirma la base antes de
      # que el worker empiece a reclamar trabajos.
      app:
        condition: service_healthy
    environment: *app-env
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/media:/data/media:z"
      - "${DATA_ROOT:?falta DATA_ROOT}/uploads:/data/uploads:z"
    # ffmpeg necesita margen. Ajusta WORKER_CPUS al número de núcleos que
    # quieras cederle; el resto del host sigue respondiendo gracias al `nice`.
    cpus: ${WORKER_CPUS:-2}
    mem_limit: ${WORKER_MEMORY:-1536m}
    # ffmpeg y x264 abren hilos, y los hilos cuentan en este límite: 1024 deja
    # margen de sobra a la transcodificación y sigue frenando un fork bomb.
    pids_limit: 1024
    security_opt: [ "no-new-privileges:true" ]
    logging: *logging
    # Sólo `backend` (V-33/F-10): el worker es quien abre ficheros hostiles con
    # ffmpeg, qpdf y Ghostscript, así que es justo el que no debe tener salida a
    # Internet. Todo lo que necesita —Postgres y el árbol de medios— es local.
    networks: [backend]

  # ---------------------------------------------------------------------------
  # nginx con la configuración de infra/nginx DENTRO de la imagen (misma
  # etiqueta que app y worker: se despliegan como un trío coherente). Lo único
  # que monta son los medios que sirve con sendfile.
  proxy:
    image: ghcr.io/jamataran/moodleshield/proxy:v1.0.5
    restart: unless-stopped
    depends_on:
      app:
        # /healthz se reenvía a app:3000. No tiene sentido arrancar nginx hasta
        # que la aplicación haya terminado migraciones y esté realmente lista.
        condition: service_healthy
    environment:
      MEDIA_LINK_SECRET: ${MEDIA_LINK_SECRET:?falta MEDIA_LINK_SECRET}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-4g}
    volumes:
      - "${DATA_ROOT:?falta DATA_ROOT}/media:/srv/media:ro,z"
    ports:
      # Sólo en loopback: quien expone al mundo es el reverse proxy del host.
      # BIND_ADDRESS queda como alias compatible con instalaciones anteriores.
      - "${HTTP_BIND_ADDRESS:-${BIND_ADDRESS:-127.0.0.1}}:${HTTP_PORT:-43127}:8080"
    # El healthcheck viaja dentro de la imagen. Así una actualización del
    # Compose sigue siendo compatible durante el breve rollout de una imagen.
    mem_limit: 128m
    pids_limit: 128
    security_opt: [ "no-new-privileges:true" ]
    logging: *logging
    # `edge` porque es donde se publica el puerto hacia el proxy del host.
    networks: [edge]

networks:
  # Red interna sin salida a Internet: db y worker viven sólo aquí. Un fallo de
  # Ghostscript o ffmpeg con un fichero preparado no puede llamar a casa desde
  # el worker, ni la base de datos alcanzar nada de fuera (V-33/F-10).
  backend:
    driver: bridge
    internal: true
  # Con salida: sólo app (JWKS de Moodle) y proxy (publica el puerto).
  edge:
    driver: bridge
