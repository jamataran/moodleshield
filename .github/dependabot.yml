version: 2

# Las actualizaciones entran por `test`, como cualquier otro cambio: nada se
# mergea directamente contra producción (ADR-028).
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: test
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Un solo PR para las actualizaciones de parche/menor: revisar diez PRs
      # triviales cada lunes es la forma más rápida de dejar de revisarlos.
      minor-y-parche:
        update-types: [minor, patch]
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    target-branch: test
    schedule:
      interval: monthly
    labels: [dependencias, ci]

  - package-ecosystem: docker
    directory: /docker
    target-branch: test
    schedule:
      interval: monthly
    labels: [dependencias, docker]
