version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Un solo PR para las actualizaciones de parche/menor: revisar diez PRs
      # triviales cada lunes es la forma más rápida de dejar de revisarlos.
      minor-y-parche:
        update-types: [minor, patch]
    labels: [dependencias]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias, ci]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: monthly
    labels: [dependencias, docker]
