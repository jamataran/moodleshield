name: 'CD · main: publicar imágenes y desplegar en test'

# Cada push a main: verifica, construye UNA vez, publica :sha-<commit> y :edge,
# y escribe la etiqueta directamente en infra/test/compose.yml. Portainer
# (GitOps) sólo necesita leer el Compose para redesplegar test.
#
# La promoción a prod NO pasa por aquí: cd-promote.yml re-etiqueta este mismo
# digest cuando se crea un tag vX.Y.Z. Misma imagen hacia arriba.

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'infra/local/**', '.idea/**']
  workflow_dispatch:

# Los despliegues se encolan, no se cancelan: un deploy a medias es peor que
# uno tardío.
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  # Duplicado a propósito con ci.yml (que sólo corre en PRs): si crece, se
  # extrae a un workflow reutilizable.
  verify:
    name: Verificar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Dependencias sin vulnerabilidades conocidas
        run: npm audit --audit-level=low

      - name: Lint y tests
        run: |
          npm run lint
          npm test

      - name: Pruebas PDF y trazador con herramientas nativas
        run: |
          docker run --rm -v "$PWD":/src:ro -w /work node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 sh -c '
            apk add --no-cache -q ffmpeg qpdf poppler-utils ghostscript
            cp -r /src/src /src/test /src/package.json /work/
            mkdir -p /work/node_modules && cp -r /src/node_modules/. /work/node_modules/
            node --test --test-reporter=spec test/pdf-processing.test.js test/trace-reader.test.js
          '

      - name: Verificar migraciones contra Postgres real
        run: |
          trap 'docker rm -f pg >/dev/null 2>&1 || true' EXIT
          docker run -d --name pg \
            -e POSTGRES_DB=moodleshield -e POSTGRES_USER=moodleshield \
            -e POSTGRES_PASSWORD=moodleshield -p 5432:5432 postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          for i in $(seq 1 30); do docker exec pg pg_isready -U moodleshield && break; sleep 2; done
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run migrate
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run migrate
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run test:integration

      - name: Validar compose e higiene de secretos
        run: |
          set -euo pipefail
          for env in test prod; do
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/app:[^[:space:]]+$' "infra/$env/compose.yml"
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/worker:[^[:space:]]+$' "infra/$env/compose.yml"
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/proxy:[^[:space:]]+$' "infra/$env/compose.yml"
            ! grep -Eq 'IMAGE_(REPO|TAG)' "infra/$env/compose.yml"
            # El stack tiene que ser autocontenido: un bind del repositorio
            # apunta a un directorio que no existe cuando lo despliega Portainer.
            ! grep -q 'INFRA_ROOT' "infra/$env/compose.yml"
            docker compose --env-file "infra/$env/.env.sample" --env-file "infra/$env/.env.ci" \
              -f "infra/$env/compose.yml" config -q
          done
          docker compose -f infra/local/compose.yml config -q
          fail=0
          for f in infra/*/.env.sample; do
            while IFS= read -r line; do
              case "$line" in \#*|'') continue ;; esac
              key=${line%%=*}; value=${line#*=}
              case "$key" in
                *SECRET*|*PASSWORD*|*TOKEN*|*AUTHKEY*)
                  [ -n "$value" ] && { echo "::error file=$f::$key tiene valor"; fail=1; } ;;
              esac
            done < "$f"
          done
          exit $fail

  # Un solo job para publicar y desplegar: evita pagar el arranque de otra VM.
  release:
    name: Publicar sha y desplegar test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: verify
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Calcular etiquetas
        id: meta
        run: |
          repo=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "sha_tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Una invocación para las tres imágenes: worker reutiliza todas las capas
      # de app. `proxy` es nginx + la configuración de infra/nginx. Se publican
      # manifiestos amd64 y arm64 para servidores y NAS de ambas arquitecturas.
      - name: Bake y push (app + worker + proxy)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          # Sin esto bake construye desde el contexto git REMOTO
          # (…git#refs/pull/N/merge), que GitHub borra al cerrar la PR: una
          # reejecución posterior muere con «repository does not contain ref».
          source: .
          files: docker/docker-bake.hcl
          targets: default
          push: true
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.attest=type=sbom
            *.attest=type=provenance,mode=max
        env:
          REGISTRY: ghcr.io
          REPO: ${{ steps.meta.outputs.repo }}
          TAGS: ${{ steps.meta.outputs.sha_tag }},edge
          APP_VERSION: ${{ steps.meta.outputs.sha_tag }}
          PLATFORMS: linux/amd64,linux/arm64

      - name: Instalar cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Firmar los tres manifiestos publicados (keyless OIDC)
        env:
          REPO: ${{ steps.meta.outputs.repo }}
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          set -euo pipefail
          for image in app worker proxy; do
            cosign sign --yes "ghcr.io/${REPO}/${image}:${SHA_TAG}"
          done

      - name: CVE altas/críticas · app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo }}/app:${{ steps.meta.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'

      - name: CVE altas/críticas · worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo }}/worker:${{ steps.meta.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'

      - name: CVE altas/críticas · proxy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ steps.meta.outputs.repo }}/proxy:${{ steps.meta.outputs.sha_tag }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'

      - name: Desplegar en test (bump de infra/test/compose.yml)
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # El checkout está anclado al SHA del evento. Si mientras se construía
          # aterrizó otro push, hacer el sed sobre esa base antigua y rebasar
          # después provoca conflicto en las MISMAS líneas (image:) y el deploy
          # falla sin posibilidad de recuperarlo con un re-run. Por eso se parte
          # siempre de la punta real de main, y se reintenta si nos adelantan.
          for intento in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main

            sed -i -E "s|^    image: ghcr.io/jamataran/moodleshield/app:.*$|    image: ghcr.io/jamataran/moodleshield/app:${SHA_TAG}|"       infra/test/compose.yml
            sed -i -E "s|^    image: ghcr.io/jamataran/moodleshield/worker:.*$|    image: ghcr.io/jamataran/moodleshield/worker:${SHA_TAG}|" infra/test/compose.yml
            sed -i -E "s|^    image: ghcr.io/jamataran/moodleshield/proxy:.*$|    image: ghcr.io/jamataran/moodleshield/proxy:${SHA_TAG}|"   infra/test/compose.yml
            # El mismo commit activa el entorno reducido: nunca se aplica a una
            # imagen antigua cuyo config.js todavía exige los secretos web.
            sed -i "s|environment: \*app-env # WORKER_ENV_ACTIVATION|environment: *worker-env # WORKER_ENV_ACTIVATION|" infra/test/compose.yml

            if git diff --quiet -- infra/test/compose.yml; then
              echo "Sin cambios (la etiqueta ya era ${SHA_TAG})"; exit 0
            fi

            git add infra/test/compose.yml
            # Los pushes con GITHUB_TOKEN no disparan workflows; el [skip ci] es
            # el cinturón además de los tirantes.
            git commit -m "deploy(test): ${SHA_TAG} [skip ci]"
            if git push origin main; then
              echo "Desplegado ${SHA_TAG} en test"; exit 0
            fi
            echo "main se movió durante el push; reintento $intento"
            git reset --hard origin/main
          done
          echo "::error::No se pudo empujar el bump tras 3 intentos"; exit 1

      - name: Avisar a Portainer (opcional)
        env:
          WEBHOOK: ${{ secrets.PORTAINER_WEBHOOK_TEST }}
        run: |
          if [ -z "${WEBHOOK:-}" ]; then
            echo "Sin webhook: Portainer redesplegará en su próximo polling."; exit 0
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST "$WEBHOOK")
          echo "Portainer respondió $code"; [ "$code" -lt 400 ]

      - name: Resumen
        env:
          SHA_TAG: ${{ steps.meta.outputs.sha_tag }}
        run: |
          {
            echo "### Test → \`${SHA_TAG}\`"
            echo ""
            echo "Para promocionar ESTA MISMA imagen a producción:"
            echo '```'
            echo "git tag v0.X.Y ${GITHUB_SHA::7} && git push origin v0.X.Y"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
