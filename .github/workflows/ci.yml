name: '[AUTO] CI · valida cada PR'

# Sólo en pull requests. Los pushes a `test` los cubre cd-test.yml (que ya
# verifica antes de publicar): así cada commit se construye UNA vez, no dos.

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'infra/local/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # El 18 de agosto de 2026 una rama de features traía cambios en
  # infra/prod/compose.yml; al mergear, Portainer los recogió e intentó
  # redesplegar producción con un Compose que exigía secretos que aún no
  # existían. Producción no se toca trabajando: se toca al promocionar, y de
  # eso se encarga cd-promote.yml (ADR-028). Aquí se cierra la puerta.
  frontera-entornos:
    name: Frontera entre entornos
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.base_ref == 'test'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Lo que hay que proteger es que NADIE MUEVA LA VERSIÓN DESPLEGADA salvo la
      # promoción (ADR-028), no que `infra/prod/` sea intocable. La regla ancha
      # —«ninguna PR hacia test toca infra/prod/»— dejaba ese árbol sin ningún
      # camino de mantenimiento: el Compose de producción se quedó sin
      # REPORTS_API_TOKEN y su plantilla envejeció, porque la única vía que el
      # mensaje de error proponía —«va en la PR de promoción»— no existe desde
      # que `cd-promote.yml` mergea solo, sin PR.
      #
      # Así que se protege exactamente la línea que la promoción escribe, y el
      # resto del árbol de producción viaja por el carril normal: PR a `test`,
      # CI, y a producción con la siguiente promoción y su número de versión.
      - name: infra/prod no mueve la versión desplegada
        env:
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$BASE" main

          tocados=$(git diff --name-only "origin/${BASE}...HEAD" -- infra/prod/)
          if [ -z "$tocados" ]; then
            echo "Sin cambios en infra/prod/."
            exit 0
          fi
          echo "Esta PR toca infra/prod/:"; echo "$tocados"

          if ! echo "$tocados" | grep -qx 'infra/prod/compose.yml'; then
            echo "No toca el Compose de producción: adelante."
            exit 0
          fi

          # Las tres etiquetas de imagen y el ancla de entorno del worker son lo
          # que `cd-promote.yml` reescribe al desplegar, y por tanto lo único de
          # este árbol que una PR no puede decidir.
          #
          # La condición NO es «no las toques» sino «que digan lo que corre de
          # verdad en producción», es decir, lo mismo que `main`. Prohibir el
          # cambio a secas dejaba sin arreglo un fichero que se hubiera quedado
          # atrás —y se quedó: estuvo en v1.0.5 con producción en v1.0.8—, que es
          # justo el estado que hace que alguien lea una versión equivocada.
          # Comparar contra `main` cierra las dos puertas a la vez: no se puede
          # inventar una versión, y no se puede dejar el fichero mintiendo.
          patron='^ *(image: ghcr\.io/|environment: \*[a-z-]+ # WORKER_ENV_ACTIVATION)'
          git show "origin/main:infra/prod/compose.yml" | grep -E "$patron" > /tmp/prod-main.txt
          git show 'HEAD:infra/prod/compose.yml'        | grep -E "$patron" > /tmp/prod-pr.txt

          if ! diff -u --label 'lo que corre en producción (main)' /tmp/prod-main.txt \
                        --label 'lo que declara esta PR'          /tmp/prod-pr.txt; then
            echo "::error::El Compose de producción de esta PR no declara la versión desplegada."
            echo "Esas líneas sólo las escribe «[MANUAL] Promocionar a producción», que"
            echo "re-etiqueta el digest ya ensayado en test (ADR-028). Copia las de main:"
            echo "  git checkout origin/main -- infra/prod/compose.yml   # y repite tus cambios"
            echo "o, si sólo se han quedado atrás tras una promoción, sincronízalas y ya está."
            exit 1
          fi
          echo "Declara la versión que corre en producción: adelante."

  verify:
    name: Lint, tests e infraestructura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Dependencias sin vulnerabilidades conocidas
        run: npm audit --audit-level=low

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      # qpdf, poppler-utils y Ghostscript sólo existen en la imagen del worker:
      # el runner no los tiene, así que ahí esas pruebas se saltan solas. Este
      # paso las ejecuta donde de verdad se van a ejecutar en producción.
      - name: Pruebas de PDF con las herramientas del worker
        run: |
          docker run --rm -v "$PWD":/src:ro -w /work node:22-alpine@sha256:c610fcdfb1d5b4740dd70c284ed3cb16bb857e0f7166196e36a5501df7a3aa32 sh -c '
            apk add --no-cache -q ffmpeg qpdf poppler-utils ghostscript
            cp -r /src/src /src/test /src/package.json /work/
            mkdir -p /work/node_modules && cp -r /src/node_modules/. /work/node_modules/
            node --test --test-reporter=spec test/pdf-processing.test.js test/trace-reader.test.js
          '

      - name: Verificar migraciones contra Postgres real
        run: |
          trap 'docker rm -f pg >/dev/null 2>&1 || true' EXIT
          docker run -d --name pg \
            -e POSTGRES_DB=moodleshield -e POSTGRES_USER=moodleshield \
            -e POSTGRES_PASSWORD=moodleshield -p 5432:5432 postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
          for i in $(seq 1 30); do docker exec pg pg_isready -U moodleshield && break; sleep 2; done
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run migrate
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run migrate   # idempotencia
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run test:integration

      - name: Validar compose de los tres entornos
        run: |
          set -euo pipefail
          for env in test prod; do
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/app:[^[:space:]]+$' "infra/$env/compose.yml"
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/worker:[^[:space:]]+$' "infra/$env/compose.yml"
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/proxy:[^[:space:]]+$' "infra/$env/compose.yml"
            ! grep -Eq 'IMAGE_(REPO|TAG)' "infra/$env/compose.yml"
            # Autocontenido: nada montado desde el repositorio. Portainer clona
            # el stack en su propio volumen, así que un bind al repo apunta a un
            # directorio inexistente y Docker lo crea vacío (el proxy arrancaba
            # con la configuración por defecto y se quedaba en unhealthy).
            ! grep -q 'INFRA_ROOT' "infra/$env/compose.yml"
            docker compose --env-file "infra/$env/.env.sample" --env-file "infra/$env/.env.ci" \
              -f "infra/$env/compose.yml" config -q
            echo "infra/$env OK"
          done
          docker compose -f infra/local/compose.yml config -q
          echo "infra/local OK"

      - name: Ningún secreto en los .env versionados
        run: |
          set -euo pipefail
          fail=0
          # V-23: antes sólo recorría `.env.sample`, así que un token real en un
          # `.env` o `.env.example` versionado por error no lo veía. Ahora recorre
          # todos los ficheros con formato KEY=VALUE que git tenga trackeados
          # bajo infra/, SALVO los `.env.ci`: ésos llevan valores de relleno de CI
          # a propósito (DB_PASSWORD=ci, …) que el paso «Validar compose»
          # necesita, y son de baja entropía, no secretos reales. (Los compose.yml
          # son YAML y no pasan por este parser; su saneado se documenta en
          # docs/auditoria-seguridad.md.)
          #
          # `infra/local/.env.example` es el tercer caso de la misma familia que
          # los `.env.ci`: el entorno local trae las dos APIs encendidas y los
          # secretos puestos a propósito, que es lo que permite levantarlo y
          # probarlo sin configurar nada. Ahí la regla no puede ser «vacío» —eso
          # rompería el arranque en local—, pero tampoco «lo que sea», que es
          # como se cuela un token real. Se exige que el valor SE DECLARE de
          # desarrollo: sólo minúsculas, dígitos y guiones, y con `local`
          # dentro. Un secreto de verdad —`openssl rand -hex 32`, un bearer de
          # Moodle, una contraseña con mayúsculas o símbolos— no cumple ninguna
          # de las dos cosas y sigue fallando aquí.
          for f in $(git ls-files 'infra/*/.env' 'infra/*/.env.sample' 'infra/*/.env.example'); do
            [ -f "$f" ] || continue
            while IFS= read -r line; do
              case "$line" in \#*|'') continue ;; esac
              key=${line%%=*}; value=${line#*=}
              case "$key" in
                *SECRET*|*PASSWORD*|*TOKEN*|*AUTHKEY*)
                  [ -n "$value" ] || continue
                  if [ "$f" = 'infra/local/.env.example' ] &&
                     printf '%s' "$value" | grep -qE '^[a-z0-9-]+$' &&
                     printf '%s' "$value" | grep -q 'local'; then
                    continue
                  fi
                  if [ "$f" = 'infra/local/.env.example' ]; then
                    echo "::error file=$f::$key no se declara de desarrollo (minúsculas, dígitos y guiones, con «local» dentro). Si es un secreto real, sácalo de aquí"
                  else
                    echo "::error file=$f::$key tiene valor en un fichero versionado"
                  fi
                  fail=1 ;;
              esac
            done < "$f"
          done
          exit $fail

  build:
    name: Construir imágenes (sin publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Bake (app + worker + proxy)
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        with:
          # Sin esto bake construye desde el contexto git REMOTO
          # (…git#refs/pull/N/merge), que GitHub borra al cerrar la PR: una
          # reejecución posterior muere con «repository does not contain ref».
          source: .
          files: docker/docker-bake.hcl
          targets: default
          push: false
          set: |
            *.platform=linux/amd64
            *.output=type=docker
        env:
          APP_VERSION: ${{ github.sha }}
          # Los ámbitos de caché los declara cada target en docker-bake.hcl: uno
          # por imagen. Con un `*.cache-to` comodín las tres compartían ámbito y
          # se peleaban por reservar la misma entrada («failed to reserve cache»).
          CACHE: gha

      # v0.36.0 es posterior a la incidencia de credenciales de Trivy de marzo
      # de 2026 y se fija al commit firmado, no a un tag mutable.
      - name: CVE altas/críticas · app
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/moodleshield/app:dev
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'

      - name: CVE altas/críticas · worker
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/moodleshield/worker:dev
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'

      - name: CVE altas/críticas · proxy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/moodleshield/proxy:dev
          severity: CRITICAL,HIGH
          vuln-type: os,library
          exit-code: '1'
