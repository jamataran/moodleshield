name: 'CI · PR: validar código, infraestructura y build'

# Sólo en pull requests. Los pushes a main los cubre cd-main.yml (que ya
# verifica antes de publicar): así cada commit se construye UNA vez, no dos.

on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md', 'LICENSE', 'infra/local/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, tests e infraestructura
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependencias
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Tests unitarios
        run: npm test

      # qpdf, poppler-utils y Ghostscript sólo existen en la imagen del worker:
      # el runner no los tiene, así que ahí esas pruebas se saltan solas. Este
      # paso las ejecuta donde de verdad se van a ejecutar en producción.
      - name: Pruebas de PDF con las herramientas del worker
        run: |
          docker run --rm -v "$PWD":/src:ro -w /work node:22-alpine sh -c '
            apk add --no-cache -q qpdf poppler-utils ghostscript
            cp -r /src/src /src/test /src/package.json /work/
            mkdir -p /work/node_modules && cp -r /src/node_modules/. /work/node_modules/
            node --test --test-reporter=spec test/pdf-processing.test.js
          '

      - name: Verificar migraciones contra Postgres real
        run: |
          trap 'docker rm -f pg >/dev/null 2>&1 || true' EXIT
          docker run -d --name pg \
            -e POSTGRES_DB=moodleshield -e POSTGRES_USER=moodleshield \
            -e POSTGRES_PASSWORD=moodleshield -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do docker exec pg pg_isready -U moodleshield && break; sleep 2; done
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run migrate
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run migrate   # idempotencia
          DB_HOST=127.0.0.1 DB_PASSWORD=moodleshield npm run test:integration

      - name: Validar compose de los tres entornos
        run: |
          set -euo pipefail
          for env in test prod; do
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/app:[^[:space:]]+$' "infra/$env/compose.yml"
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/worker:[^[:space:]]+$' "infra/$env/compose.yml"
            grep -Eq '^    image: ghcr.io/[^[:space:]]+/proxy:[^[:space:]]+$' "infra/$env/compose.yml"
            ! grep -Eq 'IMAGE_(REPO|TAG)' "infra/$env/compose.yml"
            # Autocontenido: nada montado desde el repositorio. Portainer clona
            # el stack en su propio volumen, así que un bind al repo apunta a un
            # directorio inexistente y Docker lo crea vacío (el proxy arrancaba
            # con la configuración por defecto y se quedaba en unhealthy).
            ! grep -q 'INFRA_ROOT' "infra/$env/compose.yml"
            docker compose --env-file "infra/$env/.env.sample" --env-file "infra/$env/.env.ci" \
              -f "infra/$env/compose.yml" config -q
            echo "infra/$env OK"
          done
          docker compose -f infra/local/compose.yml config -q
          echo "infra/local OK"

      - name: Ningún secreto en los .env versionados
        run: |
          set -euo pipefail
          fail=0
          for f in infra/*/.env.sample; do
            while IFS= read -r line; do
              case "$line" in \#*|'') continue ;; esac
              key=${line%%=*}; value=${line#*=}
              case "$key" in
                *SECRET*|*PASSWORD*|*TOKEN*|*AUTHKEY*)
                  if [ -n "$value" ]; then
                    echo "::error file=$f::$key tiene valor en un fichero versionado"
                    fail=1
                  fi ;;
              esac
            done < "$f"
          done
          exit $fail

  build:
    name: Construir imágenes (sin publicar)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Bake (app + worker + proxy)
        uses: docker/bake-action@v6
        with:
          files: docker/docker-bake.hcl
          targets: default
          push: false
          set: |
            *.cache-from=type=gha
            *.cache-to=type=gha,mode=max
            *.platform=linux/amd64
        env:
          APP_VERSION: ${{ github.sha }}
