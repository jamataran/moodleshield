<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Documento · MoodleShield</title>
  <link rel="stylesheet" href="/assets/app.css?v={{ASSET_VERSION}}">
</head>
<body class="viewer viewer-single">
  <header class="viewer-topbar">
    <button id="back-to-classroom" type="button" class="back-to-classroom" hidden>← Atrás</button>
    <button id="legal-chip" type="button" class="legal-chip" aria-haspopup="dialog" aria-controls="legal-dialog">
      <span class="legal-chip-icon" aria-hidden="true">⚠</span>
      <strong>Sesión monitorizada</strong>
      <span class="legal-chip-id" id="viewer"></span>
      <span class="legal-chip-cta">Ver detalles</span>
    </button>
    <button id="toggle-panel" type="button" class="topbar-icon" aria-pressed="false" aria-label="Ocultar el panel del material">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Zm5 2H4v12h5V6Zm2 0v12h9V6h-9Z"/>
      </svg>
    </button>
  </header>

  <main class="viewer-shell">
    <aside class="viewer-sidebar" aria-label="Panel del material">
      <div class="sidebar-heading">
        <p class="eyebrow" id="resource-kind">Documento PDF</p>
        <h1 id="title"></h1>
      </div>
      <section class="resource-actions" aria-label="Acciones del recurso">
        <button id="download-action" type="button" class="sidebar-action primary">Descargar PDF marcado</button>
        <p id="download-help" class="muted"></p>
        <p id="notice" class="notice info" hidden></p>
        <p id="accessibility-note" class="notice info" hidden>
          Este documento no tiene estructura de texto accesible. No se realiza
          reconocimiento óptico de caracteres: si necesitas una versión accesible,
          pídesela a tu profesor.
        </p>
        <p id="status" class="viewer-status muted" role="status" aria-live="polite" hidden></p>
      </section>
    </aside>
    <section class="viewer-main" aria-label="Contenido del documento">
      <div id="content" class="viewer-content"></div>
    </section>
  </main>

  <dialog id="legal-dialog" class="legal-dialog" aria-labelledby="legal-heading">
    <h2 id="legal-heading">Aviso de propiedad intelectual</h2>
    <div id="legal-copy" class="legal-copy"></div>
    <h3>Datos registrados de esta sesión</h3>
    <dl id="legal-audit" class="legal-audit"></dl>
    <form method="dialog" class="dialog-actions">
      <button value="ok" class="primary">Entendido</button>
    </form>
  </dialog>

  <script id="bootstrap" type="application/json">{{BOOTSTRAP}}</script>
  <script type="module" src="/assets/pdf.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
