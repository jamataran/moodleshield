<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Esta página es la portada de facto: la raíz redirige aquí. No lleva marca,
       ni producto, ni mención a Moodle o LTI, para no anunciar a quien pasa por
       el dominio qué hay detrás. No es ocultación —/lti/keys y el handshake OIDC
       siguen siendo públicos porque Moodle los pide sin autenticar— pero un
       escaneo oportunista se encuentra un formulario y nada más. -->
  <title>Acceso</title>
  <link rel="stylesheet" href="/assets/app.css?v={{ASSET_VERSION}}">
</head>
<body class="admin login-page">
  <main class="login-card panel">
    <h1>Acceso</h1>
    <div id="notice" class="notice error" hidden></div>
    <form method="post" action="/admin/login" autocomplete="on">
      <input type="hidden" name="_csrf">
      <label>Usuario<input name="username" autocomplete="username" required autofocus></label>
      <label>Contraseña<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="primary" type="submit">Entrar</button>
    </form>
  </main>
  <script id="bootstrap" type="application/json">{{BOOTSTRAP}}</script>
  <script src="/assets/login.js?v={{ASSET_VERSION}}" defer></script>
</body>
</html>
