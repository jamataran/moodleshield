<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoodleShield</title>
  <link rel="stylesheet" href="/assets/app.css?v={{ASSET_VERSION}}">
</head>
<body class="viewer viewer-collection">
  <header class="viewer-header">
    <button id="back-to-classroom" type="button" class="back-to-classroom" hidden>← Volver al aula</button>
    <div class="viewer-heading">
      <p class="eyebrow" id="resource-kind" hidden></p>
      <h1 id="title"></h1>
      <p class="muted" id="description" hidden></p>
    </div>
    <div class="viewer-monitoring" aria-label="Datos visibles de monitorización">
      <strong>Sesión monitorizada</strong>
      <span id="viewer"></span>
    </div>
  </header>

  <section class="legal-warning" aria-labelledby="legal-heading">
    <span class="legal-warning-icon" aria-hidden="true">⚠</span>
    <div>
      <strong id="legal-heading">Aviso de propiedad intelectual</strong>
      <p id="legal-copy"></p>
    </div>
  </section>

  <main class="viewer-shell collection-viewer-shell">
    <aside class="viewer-sidebar collection-sidebar">
      <nav class="collection-index" aria-label="Materiales de esta actividad">
        <label class="only-mobile" for="item-select">Material de la actividad</label>
        <select id="item-select" class="only-mobile"></select>
        <ol id="item-list" class="only-desktop"></ol>
      </nav>
      <section class="resource-actions" aria-label="Acciones del recurso actual">
        <h2>Acciones</h2>
        <button id="download-action" type="button" class="sidebar-action" disabled>Descargar</button>
        <p id="download-help" class="muted"></p>
      </section>
    </aside>

    <section class="viewer-main collection-main" aria-label="Material actual">
      <div id="content" class="viewer-content"></div>
      <div class="collection-footer">
        <div class="collection-nav">
          <button id="prev" type="button">← Anterior</button>
          <span class="muted" id="position" role="status"></span>
          <button id="next" type="button">Siguiente →</button>
        </div>
        <p id="notice" class="notice info" hidden></p>
        <p id="status" class="viewer-status muted" role="status" aria-live="polite" hidden></p>
      </div>
    </section>
  </main>

  <script id="bootstrap" type="application/json">{{BOOTSTRAP}}</script>
  <script src="/vendor/hls.min.js?v={{ASSET_VERSION}}"></script>
  <script type="module" src="/assets/collection.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
