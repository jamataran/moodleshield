<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reproductor · MoodleShield</title>
  <link rel="stylesheet" href="/assets/app.css?v={{ASSET_VERSION}}">
</head>
<body class="viewer viewer-single">
  <header class="viewer-header">
    <button id="back-to-classroom" type="button" class="back-to-classroom" hidden>← Volver al aula</button>
    <div class="viewer-heading">
      <p class="eyebrow" id="resource-kind">Vídeo</p>
      <h1 id="title"></h1>
    </div>
    <div class="viewer-monitoring" aria-label="Datos visibles de monitorización">
      <strong>Sesión monitorizada</strong>
      <span id="viewer"></span>
    </div>
  </header>

  <section class="legal-warning" aria-labelledby="legal-heading">
    <span class="legal-warning-icon" aria-hidden="true">⚠</span>
    <div>
      <strong id="legal-heading">Aviso de propiedad intelectual</strong>
      <p id="legal-copy"></p>
    </div>
  </section>

  <main class="viewer-shell">
    <aside class="viewer-sidebar" aria-label="Acciones del recurso">
      <h2>Acciones</h2>
      <button id="download-action" type="button" class="sidebar-action" disabled>Descargar vídeo</button>
      <p id="download-help" class="muted"></p>
      <p id="notice" class="notice info" hidden></p>
      <p id="status" class="viewer-status muted" role="status" aria-live="polite"></p>
    </aside>
    <section class="viewer-main" aria-label="Contenido del vídeo">
      <div id="content" class="viewer-content"></div>
    </section>
  </main>

  <script id="bootstrap" type="application/json">{{BOOTSTRAP}}</script>
  <script src="/vendor/hls.min.js?v={{ASSET_VERSION}}"></script>
  <script type="module" src="/assets/player.js?v={{ASSET_VERSION}}"></script>
</body>
</html>
